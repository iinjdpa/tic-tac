[project]
name = "261127-calibrador-reloj-pendulo"
version = "0.1.0"
description = "Calibrador acústico para relojes de péndulo (CLI en Python + PWA móvil)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av>=19.0.2",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
calibrador = "calibrador.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "calibrador"

